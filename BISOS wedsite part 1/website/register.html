<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register for BISOS - Branch Inventory and Sales Optimization System">
    <title>Register | BISOS</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <main class="auth-container" role="main" style="max-width:520px">
        <div class="auth-box">
            <div class="auth-header">
                <div class="auth-logo-icon" aria-hidden="true">B</div>
                <h1>Create Account</h1>
                <p class="subtitle">Join BISOS to manage your store</p>
            </div>

            <form id="registerForm" class="auth-form" novalidate>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user" aria-hidden="true"></i>
                            <input type="text" id="firstName" name="firstName"
                                   placeholder="First name" required autocomplete="given-name">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user" aria-hidden="true"></i>
                            <input type="text" id="lastName" name="lastName"
                                   placeholder="Last name" required autocomplete="family-name">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope" aria-hidden="true"></i>
                        <input type="email" id="email" name="email"
                               placeholder="Enter your email" required autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <div class="input-wrapper">
                        <i class="fas fa-phone" aria-hidden="true"></i>
                        <input type="tel" id="phone" name="phone"
                               placeholder="e.g. 011-123-4567" autocomplete="tel">
                    </div>
                </div>

                <div class="form-group">
                    <label for="role">Role</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user-tag" aria-hidden="true"></i>
                        <select id="role" name="role" required style="padding-left:2.4rem;width:100%;border:2px solid #E0E0E0;border-radius:8px;padding-top:0.7rem;padding-bottom:0.7rem;font-size:0.95rem">
                            <option value="">Select your role</option>
                            <option value="store_owner">Store Owner</option>
                            <option value="manager">Manager</option>
                            <option value="clerk">Clerk</option>
                            <option value="cashier">Cashier</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock" aria-hidden="true"></i>
                        <input type="password" id="password" name="password"
                               placeholder="Min. 8 characters" required autocomplete="new-password">
                        <button type="button" class="toggle-password" aria-label="Show password">
                            <i class="fas fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock" aria-hidden="true"></i>
                        <input type="password" id="confirmPassword" name="confirmPassword"
                               placeholder="Repeat your password" required autocomplete="new-password">
                    </div>
                </div>

                <div style="margin-bottom:1.25rem;font-size:0.875rem">
                    <label style="display:flex;align-items:flex-start;gap:0.5rem;cursor:pointer">
                        <input type="checkbox" name="terms" required style="margin-top:3px">
                        I agree to the <a href="terms.html" style="color:var(--primary-light)">Terms of Service</a>
                        and <a href="privacy.html" style="color:var(--primary-light)">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-user-plus" aria-hidden="true"></i> Create Account
                </button>
            </form>

            <p class="register-link">
                Already have an account? <a href="login.html">Sign in</a>
            </p>
        </div>
    </main>

    <script type="module" src="../js/auth.js"></script>
</body>
</html>
