name: Deploy PHP to Azure Web App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        coverage: none

    - name: Validate PHP Syntax
      run: |
        find . -name "*.php" -exec php -l {} \;

    # You will need to download the Publish Profile from your Azure Web App dashboard
    # and save it as a GitHub Secret called AZURE_WEBAPP_PUBLISH_PROFILE
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'Bisos-php'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: .